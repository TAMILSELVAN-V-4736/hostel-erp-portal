databases:
  - name: hostel-erp-db
    databaseName: hostelerp
    user: hostelerp
    plan: free

services:
  - type: web
    name: hostel-erp-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=api
    startCommand: cd apps/api && npx prisma migrate deploy && node dist/prisma/seed.js && node dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
