databases:
  - name: hostel-erp-db
    databaseName: hostelerp
    user: hostelerp
    plan: free

services:
  - type: web
    name: hostel-erp-api
    env: node
    plan: free
    buildCommand: npm install && cd apps/api && npx prisma generate && npm run build
    startCommand: cd apps/api && npx prisma migrate deploy && NODE_ENV=production npm run start:prod
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-erp-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
